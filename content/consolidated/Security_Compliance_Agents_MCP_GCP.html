login &amp; authentication types (GCP)","children":[{"content":"Human users &#x2014; sign-in","children":[{"content":"<strong>Identity Platform</strong>","children":[{"content":"Email/password, social, OIDC, SAML, MFA","children":[],"payload":{"tag":"li","lines":"21,22"}},{"content":"Firebase-compatible Web SDK v9 / v8","children":[],"payload":{"tag":"li","lines":"22,23"}},{"content":"IAM: Identity Platform Admin, Service Usage Admin","children":[],"payload":{"tag":"li","lines":"23,24"}},{"content":"<strong>Implement:</strong> Enable in Cloud Marketplace &#x2192; Identity Providers &#x2192; Add Email/Password (or social/OIDC/SAML); in app use <code>signInWithEmailAndPassword(auth, email, password)</code> (v9) or <code>firebase.auth().signInWithEmailAndPassword()</code> (v8). <a href=\"https://docs.cloud.google.com/identity-platform/docs/sign-in-user-email\">Sign in with email (Identity Platform)</a> &#xb7; <a href=\"https://cloud.google.com/identity-platform\">Identity Platform</a>","children":[],"payload":{"tag":"li","lines":"24,25"}}],"payload":{"tag":"li","lines":"20,25"}},{"content":"<strong>Google Account</strong>","children":[{"content":"Cloud Console sign-in (<code>accounts.google.com</code> with <code>service=cloudconsole</code>)","children":[],"payload":{"tag":"li","lines":"26,27"}},{"content":"<strong>Implement:</strong> Redirect users to Google sign-in with <code>service=cloudconsole</code> and <code>continue</code> URL; no extra SDK for console-only. <a href=\"https://console.cloud.google.com/\">Cloud Console</a>","children":[],"payload":{"tag":"li","lines":"27,28"}}],"payload":{"tag":"li","lines":"25,28"}},{"content":"<strong>OAuth 2.0 (3LO)</strong>","children":[{"content":"App on behalf of user &#x2014; <strong>OAuth client ID</strong> (Google API Console)","children":[],"payload":{"tag":"li","lines":"29,30"}},{"content":"Limit <strong>scopes</strong> for least privilege","children":[],"payload":{"tag":"li","lines":"30,31"}},{"content":"<strong>Implement:</strong> Create OAuth client ID in APIs &amp; Services &#x2192; Credentials; use authorization code flow + PKCE; request minimal scopes. <a href=\"https://developers.google.com/identity/protocols/oauth2\">OAuth 2.0 credentials</a> &#xb7; <a href=\"https://datatracker.ietf.org/doc/html/rfc6749\">RFC 6749</a>","children":[],"payload":{"tag":"li","lines":"31,33"}}],"payload":{"tag":"li","lines":"28,33"}}],"payload":{"tag":"h3","lines":"18,19"}},{"content":"Workloads &amp; APIs (non-human)","children":[{"content":"<strong>Application Default Credentials (ADC)</strong>","children":[{"content":"Credential discovery by environment","children":[],"payload":{"tag":"li","lines":"36,37"}},{"content":"<strong>Implement:</strong> Use client libraries (no explicit key in code); set up ADC per env: local <code>gcloud auth application-default login</code>, GCP attach SA to resource. <a href=\"https://docs.cloud.google.com/docs/authentication\">Authentication methods</a>","children":[],"payload":{"tag":"li","lines":"37,38"}}],"payload":{"tag":"li","lines":"35,38"}},{"content":"<strong>Running in GCP</strong>","children":[{"content":"<strong>IAM</strong> Service Accounts attached to <strong>Cloud Run</strong>, <strong>GKE</strong>, <strong>Compute Engine</strong>","children":[],"payload":{"tag":"li","lines":"39,40"}},{"content":"Metadata server for tokens &#x2014; no keys on disk","children":[],"payload":{"tag":"li","lines":"40,41"}},{"content":"<strong>Implement:</strong> Create SA with <code>gcloud iam service-accounts create</code>; grant roles; attach to Cloud Run (<code>--service-account=SA_EMAIL</code>), GKE (Workload Identity), or Compute Engine (<code>--service-account=SA_EMAIL</code>). <a href=\"https://cloud.google.com/iam/docs\">IAM</a> &#xb7; <a href=\"https://cloud.google.com/run/docs/securing/service-identity\">Cloud Run identity</a>","children":[],"payload":{"tag":"li","lines":"41,42"}}],"payload":{"tag":"li","lines":"38,42"}},{"content":"<strong>On-prem / other cloud</strong>","children":[{"content":"<strong>Workload Identity Federation</strong> or (last resort) <strong>Service account key</strong>","children":[],"payload":{"tag":"li","lines":"43,44"}},{"content":"<strong>Implement:</strong> Configure workload identity pool + provider; use ADC with workload identity; avoid keys. <a href=\"https://cloud.google.com/docs/authentication/set-up-adc-on-premises-or-another-cloud-provider\">Set up ADC on-prem or another cloud</a> &#xb7; <a href=\"https://cloud.google.com/iam/docs/workload-identity-federation\">Workload Identity Federation</a>","children":[],"payload":{"tag":"li","lines":"44,45"}}],"payload":{"tag":"li","lines":"42,45"}},{"content":"<strong>Single-user dev</strong>","children":[{"content":"<strong>gcloud</strong> <code>auth application-default login</code> or <strong>impersonation</strong> <code>--impersonate-service-account</code>","children":[],"payload":{"tag":"li","lines":"46,47"}},{"content":"<strong>Implement:</strong> Run <code>gcloud auth application-default login</code>; or <code>gcloud auth application-default login --impersonate-service-account=SA_EMAIL</code> for impersonation. <a href=\"https://docs.cloud.google.com/docs/authentication\">Authentication methods</a>","children":[],"payload":{"tag":"li","lines":"47,49"}}],"payload":{"tag":"li","lines":"45,49"}}],"payload":{"tag":"h3","lines":"33,34"}},{"content":"Agents &#x2014; per-agent identity","children":[{"content":"<strong>Vertex AI Agent Engine</strong>","children":[{"content":"<code>identity_type: AGENT_IDENTITY</code> &#x2014; per-agent IAM principal","children":[],"payload":{"tag":"li","lines":"52,53"}},{"content":"SPIFFE-based; <strong>CAA</strong> + <strong>mTLS</strong> &#x2014; certificate-bound tokens, reduce credential theft","children":[],"payload":{"tag":"li","lines":"53,54"}},{"content":"<strong>Implement:</strong> Create Agent Engine instance with <code>identity_type: AGENT_IDENTITY</code> (Vertex AI SDK v1beta1 or config); deploy with <code>identity_type=types.IdentityType.AGENT_IDENTITY</code>. <a href=\"https://docs.cloud.google.com/agent-builder/agent-engine/agent-identity#create-agent-identity\">Use agent identity with Vertex AI Agent Engine</a> &#xb7; <a href=\"https://cloud.google.com/vertex-ai/agent-builder\">Vertex AI Agent Builder</a>","children":[],"payload":{"tag":"li","lines":"54,55"}}],"payload":{"tag":"li","lines":"51,55"}},{"content":"<strong>IAM</strong>","children":[{"content":"Allow/deny by agent principal or principal set","children":[],"payload":{"tag":"li","lines":"56,57"}},{"content":"<strong>Principal Access Boundary (PAB)</strong> to limit resources","children":[],"payload":{"tag":"li","lines":"57,58"}},{"content":"<strong>Implement:</strong> Grant roles to <code>principal://agents.global..../reasoningEngines/AGENT_ENGINE_ID</code> or principal set; add deny/PAB to cap scope. <a href=\"https://docs.cloud.google.com/agent-builder/agent-engine/agent-identity#create-agent-identity\">Agent identity (IAM, PAB)</a>","children":[],"payload":{"tag":"li","lines":"58,59"}}],"payload":{"tag":"li","lines":"55,59"}},{"content":"<strong>Third-party (OAuth / API keys)</strong>","children":[{"content":"<strong>Secret Manager</strong> &#x2014; store client secret or API key","children":[],"payload":{"tag":"li","lines":"60,61"}},{"content":"IAM <code>secretmanager.secretAccessor</code> for <strong>agent identity</strong>","children":[],"payload":{"tag":"li","lines":"61,62"}},{"content":"Agent uses <strong>ADC</strong> to read at runtime","children":[],"payload":{"tag":"li","lines":"62,63"}},{"content":"<strong>Implement:</strong> Create secret in Secret Manager; grant agent principal <code>roles/secretmanager.secretAccessor</code>; in agent use ADC + Secret Manager client to read at runtime. <a href=\"https://cloud.google.com/secret-manager/docs\">Secret Manager</a>","children":[],"payload":{"tag":"li","lines":"63,64"}}],"payload":{"tag":"li","lines":"59,64"}},{"content":"<strong>Cloud Logging</strong>","children":[{"content":"Logs show <strong>agent identity</strong> and <strong>user identity</strong> when agent acts on user&apos;s behalf","children":[],"payload":{"tag":"li","lines":"65,66"}},{"content":"<strong>Implement:</strong> Use default Cloud Logging; agent identity and user (if present) appear in log entries. <a href=\"https://cloud.google.com/logging/docs\">Cloud Logging</a>","children":[],"payload":{"tag":"li","lines":"66,68"}}],"payload":{"tag":"li","lines":"64,68"}}],"payload":{"tag":"h3","lines":"49,50"}},{"content":"MCP (Model Context Protocol)","children":[{"content":"<strong>Google Cloud MCP servers</strong>","children":[{"content":"HTTP-based MCP auth; production: <strong>service account</strong> or <strong>agent identity</strong> (Agent Engine)","children":[],"payload":{"tag":"li","lines":"71,72"}},{"content":"Or <strong>OAuth client ID</strong> for app-on-behalf-of-user; <strong>API keys</strong> for services without IAM","children":[],"payload":{"tag":"li","lines":"72,73"}},{"content":"<strong>Implement:</strong> Supply credentials to MCP client (ADC for SA/agent identity; OAuth client for user-delegated; API key from Secret Manager for non-IAM). <a href=\"https://docs.cloud.google.com/mcp/authenticate-mcp\">Authenticate to Google and Google Cloud MCP servers</a> &#xb7; <a href=\"https://cloud.google.com/mcp\">Google Cloud MCP</a>","children":[],"payload":{"tag":"li","lines":"73,74"}}],"payload":{"tag":"li","lines":"70,74"}},{"content":"<strong>MCP at scale</strong>","children":[{"content":"<strong>Apigee</strong> &#x2014; front door: API keys, OAuth 2.0, JWT, SSO; <strong>API Products</strong> + <strong>allowed_tools</strong>","children":[],"payload":{"tag":"li","lines":"75,76"}},{"content":"<strong>Cloud Run</strong> &#x2014; MCP server runtime; <strong>Cloud Run Invoker</strong> only to <strong>Apigee</strong> SA","children":[],"payload":{"tag":"li","lines":"76,77"}},{"content":"<strong>Secret Manager</strong> (credentials); <strong>Artifact Registry</strong> (containers)","children":[],"payload":{"tag":"li","lines":"77,78"}},{"content":"<strong>Implement:</strong> Deploy MCP server container to Cloud Run (authenticated only); create Apigee API proxy &#x2192; Cloud Run; grant only Apigee SA <code>roles/run.invoker</code>; in Apigee define API Products with <code>allowed_tools</code>; developers get key from Developer Portal. <a href=\"https://medium.com/@apigeek/deploying-and-securing-mcp-servers-at-scale-with-google-cloud-run-and-apigee-d06ea39e4235\">Deploying and Securing MCP Servers with Cloud Run and Apigee</a> &#xb7; <a href=\"https://cloud.google.com/run\">Cloud Run</a> &#xb7; <a href=\"https://cloud.google.com/apigee\">Apigee</a>","children":[],"payload":{"tag":"li","lines":"78,79"}}],"payload":{"tag":"li","lines":"74,79"}},{"content":"<strong>Cloud API Registry</strong>","children":[{"content":"Centralized MCP catalog; <code>gcloud beta api-registry mcp servers list/enable</code>","children":[],"payload":{"tag":"li","lines":"80,81"}},{"content":"IAM: <code>cloudapiregistry.viewer</code>, <code>mcp.toolUser</code>; <strong>zero boilerplate</strong> tool consumption via <strong>ADK</strong> ApiRegistry","children":[],"payload":{"tag":"li","lines":"81,82"}},{"content":"<strong>Implement:</strong> Run <code>gcloud beta api-registry mcp servers list --all</code>; <code>gcloud beta api-registry mcp enable bigquery.googleapis.com</code>; grant Agent Engine SA <code>roles/cloudapiregistry.viewer</code>, <code>roles/mcp.toolUser</code>, plus data roles; in ADK use <code>ApiRegistry(PROJECT_ID).get_toolset(mcp_server_name)</code> and pass to LlmAgent. <a href=\"https://discuss.google.dev/t/where-is-the-mcp-server-deploy-your-agent-with-cloud-api-registry-on-vertex-ai-agent-engine/298130\">Deploy agent with Cloud API Registry on Vertex AI Agent Engine</a>","children":[],"payload":{"tag":"li","lines":"82,84"}}],"payload":{"tag":"li","lines":"79,84"}}],"payload":{"tag":"h3","lines":"68,69"}}],"payload":{"tag":"h2","lines":"16,17"}},{"content":"Frontend to backend: security retained","children":[{"content":"<strong>Frontend &#x2192; gateway</strong>","children":[{"content":"Client sends <strong>token or API key</strong> only (never raw passwords); HTTPS","children":[],"payload":{"tag":"li","lines":"87,88"}},{"content":"<strong>Identity Platform</strong> (ID/access tokens); <strong>Apigee</strong> (API key, OAuth 2.0, JWT)","children":[],"payload":{"tag":"li","lines":"88,89"}},{"content":"<strong>Implement:</strong> Frontend gets ID/access token from Identity Platform or OAuth; send in <code>Authorization</code> header to Apigee; Apigee VerifyAPIKey / OAuthV2 / VerifyJWT policies. <a href=\"https://cloud.google.com/identity-platform/docs\">Identity Platform</a> &#xb7; <a href=\"https://cloud.google.com/apigee/docs/api-platform/security/oauth/overview\">Apigee auth</a>","children":[],"payload":{"tag":"li","lines":"89,90"}}],"payload":{"tag":"li","lines":"86,90"}},{"content":"<strong>Gateway</strong>","children":[{"content":"<strong>Apigee</strong> &#x2014; validates credential; API Products; <strong>allowed_tools</strong> for MCP; rate limits, quotas; optional <strong>Model Armor</strong>","children":[],"payload":{"tag":"li","lines":"91,92"}},{"content":"<strong>Implement:</strong> Create API proxy with auth policies; attach to API Product; for MCP add custom attribute <code>allowed_tools</code> and filter tools/list + tool calls. <a href=\"https://cloud.google.com/apigee/docs\">Apigee</a>","children":[],"payload":{"tag":"li","lines":"92,93"}}],"payload":{"tag":"li","lines":"90,93"}},{"content":"<strong>Gateway &#x2192; backend</strong>","children":[{"content":"<strong>Cloud Run</strong> &#x2014; only <strong>Apigee</strong> service account has <strong>Cloud Run Invoker</strong>; no public anonymous access","children":[],"payload":{"tag":"li","lines":"94,95"}},{"content":"<strong>Implement:</strong> Remove <code>allUsers</code> from Cloud Run IAM; grant only <code>roles/run.invoker</code> to Apigee&#x2019;s service account. <a href=\"https://cloud.google.com/run/docs/securing/ingress\">Cloud Run IAM</a>","children":[],"payload":{"tag":"li","lines":"95,96"}}],"payload":{"tag":"li","lines":"93,96"}},{"content":"<strong>Backend credentials</strong>","children":[{"content":"<strong>Apigee Key Value Map</strong> (encrypted) or <strong>Secret Manager</strong> &#x2014; backend never sees user password","children":[],"payload":{"tag":"li","lines":"97,98"}},{"content":"<strong>Implement:</strong> Store LLM/API keys in Apigee Key Value Map (encrypted) and read in proxy; or Cloud Run reads from Secret Manager at runtime. <a href=\"https://cloud.google.com/apigee/docs/api-platform/reference/policies/key-value-map-operations-policy\">Apigee Key Value Map</a> &#xb7; <a href=\"https://cloud.google.com/secret-manager/docs\">Secret Manager</a>","children":[],"payload":{"tag":"li","lines":"98,99"}}],"payload":{"tag":"li","lines":"96,99"}},{"content":"<strong>Agent API server</strong>","children":[{"content":"Same pattern: <strong>Apigee</strong> + <strong>Cloud Run</strong> + <strong>Vertex AI / Gemini</strong>; <strong>Model Armor</strong> optional","children":[],"payload":{"tag":"li","lines":"100,101"}},{"content":"<strong>Implement:</strong> Deploy agent API (e.g. FastAPI/Flask) to Cloud Run; Apigee proxy to Cloud Run URL; optional Model Armor policy on request. <a href=\"https://medium.com/@apigeek/harnessing-apigee-api-management-platform-as-an-llm-gateway-part1-2-220d1f88b4b4\">Apigee as LLM/agent gateway Part 1</a> &#xb7; <a href=\"https://medium.com/@apigeek/harnessing-apigee-api-management-platform-as-an-llm-gateway-implementation-walkthrough-part-2-2-09afb4c4b093\">Part 2 implementation</a>","children":[],"payload":{"tag":"li","lines":"101,102"}}],"payload":{"tag":"li","lines":"99,102"}},{"content":"<strong>Audit</strong>","children":[{"content":"<strong>Cloud Logging</strong>, <strong>Cloud Trace</strong>, <strong>Apigee</strong> analytics, <strong>Vertex AI</strong> evaluation and tracing","children":[],"payload":{"tag":"li","lines":"103,104"}},{"content":"<strong>Implement:</strong> Enable Cloud Logging on Cloud Run; use Cloud Trace for requests; enable Apigee analytics; use Vertex AI evaluation/tracing for agent runs. <a href=\"https://cloud.google.com/logging/docs\">Cloud Logging</a> &#xb7; <a href=\"https://cloud.google.com/trace/docs\">Cloud Trace</a> &#xb7; <a href=\"https://github.com/google/adk-docs/blob/main/docs/evaluate/index.md\">ADK Evaluate</a>","children":[],"payload":{"tag":"li","lines":"104,106"}}],"payload":{"tag":"li","lines":"102,106"}}],"payload":{"tag":"h2","lines":"84,85"}},{"content":"VPC securing (network &amp; perimeter)","children":[{"content":"<strong>VPC Service Controls (VPC-SC)</strong>","children":[{"content":"Confine agent and API activity inside a <strong>service perimeter</strong>; API calls only to resources within the perimeter; reduces <strong>data exfiltration</strong> and impact radius","children":[],"payload":{"tag":"li","lines":"109,110"}},{"content":"<strong>Implement:</strong> Create an <strong>access context</strong> (optional: add access levels, e.g. device/region); create <strong>service perimeter</strong> (regular or bridge); add <strong>projects</strong> to the perimeter; add <strong>restricted APIs</strong> (e.g. Vertex AI, BigQuery, Cloud Storage) so only calls from inside the perimeter or allowed VPCs succeed. Run agents and MCP in projects inside the perimeter. <a href=\"https://cloud.google.com/vpc-service-controls/docs/overview\">VPC Service Controls overview</a> &#xb7; <a href=\"https://cloud.google.com/vpc-service-controls/docs/create-service-perimeter\">Create a service perimeter</a> &#xb7; <a href=\"https://raw.githubusercontent.com/google/adk-docs/main/docs/safety/index.md\">ADK Safety &#x2014; VPC-SC</a>","children":[],"payload":{"tag":"li","lines":"110,111"}}],"payload":{"tag":"li","lines":"108,111"}},{"content":"<strong>VPC network (private &amp; ingress)</strong>","children":[{"content":"Keep agent/MCP workloads off public internet; use <strong>Private Google Access</strong> for GCP APIs; restrict <strong>ingress</strong> to Cloud Run / GKE to VPC only or to load balancer","children":[],"payload":{"tag":"li","lines":"112,113"}},{"content":"<strong>Implement:</strong> Deploy Cloud Run with <strong>VPC connector</strong> or <strong>Direct VPC egress</strong>; set <strong>ingress</strong> to &quot;Internal and Cloud Load Balancing&quot; (no <code>allUsers</code>). For GKE use <strong>private cluster</strong> and <strong>authorized networks</strong>. Use <strong>Cloud Armor</strong> (optional) in front of load balancer. <a href=\"https://cloud.google.com/run/docs/configuring/vpc-direct-vpc\">Cloud Run VPC egress</a> &#xb7; <a href=\"https://cloud.google.com/run/docs/securing/ingress\">Cloud Run ingress</a> &#xb7; <a href=\"https://cloud.google.com/vpc/docs/overview\">VPC overview</a>","children":[],"payload":{"tag":"li","lines":"113,114"}}],"payload":{"tag":"li","lines":"111,114"}},{"content":"<strong>Why for agents &amp; MCP</strong>","children":[{"content":"VPC-SC ensures agent tool calls and MCP server traffic stay within your perimeter; even if credentials leak, data cannot be exfiltrated to projects/APIs outside the perimeter. VPC keeps workloads in your network and limits exposure.","children":[],"payload":{"tag":"li","lines":"115,117"}}],"payload":{"tag":"li","lines":"114,117"}}],"payload":{"tag":"h2","lines":"106,107"}},{"content":"How agents are authenticated (all methods)","children":[{"content":"<strong>Agent identity (Agent Engine)</strong> &#x2014; production on Vertex AI; <strong>Vertex AI Agent Engine</strong>, <strong>IAM</strong>, <strong>Secret Manager</strong>","children":[{"content":"<strong>Implement:</strong> Deploy agent with <code>identity_type: AGENT_IDENTITY</code>; grant IAM to agent principal; store third-party creds in Secret Manager, access via ADC. <a href=\"https://docs.cloud.google.com/agent-builder/agent-engine/agent-identity#create-agent-identity\">Agent identity</a>","children":[],"payload":{"tag":"li","lines":"120,121"}}],"payload":{"tag":"li","lines":"119,121"}},{"content":"<strong>Service account (attached)</strong> &#x2014; agent on Cloud Run/GKE/Compute Engine; <strong>IAM</strong> SA + <strong>ADC</strong>","children":[{"content":"<strong>Implement:</strong> Create SA, attach to Cloud Run/GKE/VM; app uses default credentials (metadata server). <a href=\"https://docs.cloud.google.com/docs/authentication\">Authentication methods</a>","children":[],"payload":{"tag":"li","lines":"122,123"}}],"payload":{"tag":"li","lines":"121,123"}},{"content":"<strong>Service account (impersonation)</strong> &#x2014; dev/test; <strong>gcloud</strong> / <strong>ADC</strong> <code>--impersonate-service-account</code>","children":[{"content":"<strong>Implement:</strong> <code>gcloud config set auth/impersonate_service_account SA_EMAIL</code> or <code>gcloud auth application-default login --impersonate-service-account=SA_EMAIL</code>. <a href=\"https://docs.cloud.google.com/docs/authentication\">Authentication methods</a>","children":[],"payload":{"tag":"li","lines":"124,125"}}],"payload":{"tag":"li","lines":"123,125"}},{"content":"<strong>OAuth client ID</strong> &#x2014; app on behalf of user; <strong>Google API Console</strong>; <strong>Identity Platform</strong> / OAuth flows","children":[{"content":"<strong>Implement:</strong> Create OAuth 2.0 client in Console; implement auth code flow in app; pass tokens to backend. <a href=\"https://developers.google.com/identity/protocols/oauth2\">OAuth 2.0</a>","children":[],"payload":{"tag":"li","lines":"126,127"}}],"payload":{"tag":"li","lines":"125,127"}},{"content":"<strong>API key</strong> &#x2014; services without IAM; <strong>APIs &amp; Services &gt; Credentials</strong>; <strong>Secret Manager</strong>","children":[{"content":"<strong>Implement:</strong> Create API key in Console; restrict by app/API; store in Secret Manager; app reads at runtime. <a href=\"https://cloud.google.com/docs/authentication/api-keys\">API key best practices</a>","children":[],"payload":{"tag":"li","lines":"128,129"}}],"payload":{"tag":"li","lines":"127,129"}},{"content":"<strong>User credentials (ADC)</strong> &#x2014; local dev only; <strong>gcloud auth application-default login</strong>","children":[{"content":"<strong>Implement:</strong> Run <code>gcloud auth application-default login</code>; use same code path as prod (ADC). <a href=\"https://docs.cloud.google.com/docs/authentication\">Authentication methods</a>","children":[],"payload":{"tag":"li","lines":"130,131"}}],"payload":{"tag":"li","lines":"129,131"}},{"content":"<strong>Tool-level (ADK)</strong>","children":[{"content":"<strong>Agent-Auth</strong> &#x2014; tool uses agent identity; <strong>Cloud Logging</strong> for attribution","children":[],"payload":{"tag":"li","lines":"132,133"}},{"content":"<strong>User Auth</strong> &#x2014; tool uses user OAuth; combine with <strong>ADK</strong> guardrails, <strong>Tool Context</strong>, <strong>Gemini</strong> safety","children":[],"payload":{"tag":"li","lines":"133,134"}},{"content":"<strong>Implement:</strong> For Agent-Auth authorize agent principal in external system (e.g. DB IAM). For User Auth pass OAuth token from frontend; use ADK Before Tool Callback + Tool Context for guardrails. <a href=\"https://raw.githubusercontent.com/google/adk-docs/main/docs/safety/index.md\">ADK Safety and Security</a>","children":[],"payload":{"tag":"li","lines":"134,136"}}],"payload":{"tag":"li","lines":"131,136"}}],"payload":{"tag":"h2","lines":"117,118"}},{"content":"How MCP is authenticated &amp; connects to agents securely","children":[{"content":"MCP client auth (Google)","children":[{"content":"<strong>Agent identity</strong> &#x2014; <strong>Vertex AI Agent Engine</strong>","children":[{"content":"<strong>Implement:</strong> Deploy agent on Agent Engine with age :"210,211"}}],"payload":{"tag":"h2","lines":"175,176"}},{"content":"When to use &amp; service combinations","children":[{"content":"Decision guidance &#x2014; when to use each","children":[{"content":"<strong>Identity Platform</strong> &#x2014; user-facing apps; email/password, social, OIDC/SAML, MFA","children":[],"payload":{"tag":"li","lines":"221,222"}},{"content":"<strong>Agent identity (Agent Engine)</strong> &#x2014; production agents; per-agent IAM principal; different permissions per agent","children":[],"payload":{"tag":"li","lines":"222,223"}},{"content":"<strong>Service account (attached)</strong> &#x2014; agent on Cloud Run/GKE/Compute Engine; shared SA OK","children":[],"payload":{"tag":"li","lines":"223,224"}},{"content":"<strong>Apigee (gateway)</strong> &#x2014; API management: auth, rate limits, quotas, tool-level access (<code>allowed_tools</code>), analytics, developer portal","children":[],"payload":{"tag":"li","lines":"224,225"}},{"content":"<strong>Cloud API Registry</strong> &#x2014; centralized MCP catalog; registry-first; zero-boilerplate; unified discovery/governance","children":[],"payload":{"tag":"li","lines":"225,226"}},{"content":"<strong>Model Armor</strong> &#x2014; prompt injection/jailbreak protection; malicious URI filtering; Agent-Only (AO) mode; user-provided prompts","children":[],"payload":{"tag":"li","lines":"226,227"}},{"content":"<strong>VPC Service Controls</strong> &#x2014; data exfiltration prevention; confine API calls to perimeter; high-security; compliance","children":[],"payload":{"tag":"li","lines":"227,228"}},{"content":"<strong>ADK Tool Context / Before Tool Callback</strong> &#x2014; in-app policy; validate tool params; session/user role checks; complement gateway/registry RBAC","children":[],"payload":{"tag":"li","lines":"228,229"}},{"content":"<strong>Gemini content filters</strong> &#x2014; using Gemini models; built-in content safety (CSAM, PII, configurable filters)","children":[],"payload":{"tag":"li","lines":"229,230"}},{"content":"<strong>Secret Manager</strong> &#x2014; store API keys, OAuth secrets, credentials; avoid hardcoding","children":[],"payload":{"tag":"li","lines":"230,231"}},{"content":"<strong>Cloud Logging / Trace</strong> &#x2014; audit trail; debugging; compliance; always use","children":[],"payload":{"tag":"li","lines":"231,233"}}],"payload":{"tag":"h3","lines":"219,220"}},{"content":"Common combinations (how services dock)","children":[{"content":"<strong>Combination 1: Enterprise MCP at scale</strong>","children":[{"content":"<strong>Apigee</strong> (front door) &#x2192; <strong>Cloud Run</strong> (MCP server) &#x2192; <strong>Cloud API Registry</strong> (optional) &#x2192; <strong>Secret Manager</strong> &#x2192; <strong>Cloud Logging</strong>","children":[],"payload":{"tag":"li","lines":"236,237"}},{"content":"<strong>When:</strong> Large org; multiple MCP servers; need governance, tool-level RBAC, analytics","children":[],"payload":{"tag":"li","lines":"237,238"}},{"content":"<strong>Flow:</strong> Client &#x2192; Apigee (auth + <code>allowed_tools</code>) &#x2192; Cloud Run &#x2192; backend. Apigee filters tools/list, blocks unauthorized calls","children":[],"payload":{"tag":"li","lines":"238,239"}}],"payload":{"tag":"li","lines":"235,239"}},{"content":"<strong>Combination 2: Registry-first with Agent Engine</strong>","children":[{"content":"<strong>Cloud API Registry</strong> &#x2192; <strong>Vertex AI Agent Engine</strong> (agent identity) &#x2192; <strong>IAM</strong> &#x2192; <strong>ADK</strong> (ApiRegistry)","children":[],"payload":{"tag":"li","lines":"240,241"}},{"content":"<strong>When:</strong> Agents on Agent Engine; zero-boilerplate; centralized governance","children":[],"payload":{"tag":"li","lines":"241,242"}},{"content":"<strong>Flow:</strong> Admin enables MCP in registry &#x2192; Agent Engine SA has roles &#x2192; Agent uses ADK ApiRegistry &#x2192; gets tools (no manual URLs/secrets)","children":[],"payload":{"tag":"li","lines"
